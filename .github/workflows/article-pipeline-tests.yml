name: Article pipeline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-pipeline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  article-pipeline-tests:
    name: article-pipeline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated pipeline tests
        run: npm test
